name: Release dsh-fnos-advanced

# Manual-only release. The version and tag are derived from
# dsh-fnos-advanced/package.json, so there is no version input to mistype.
#
# Release convention (used by future plugin self-update):
#   tag:    dsh-fnos-advanced-v<version>
#   assets: dsh-fnos-advanced-<version>.tgz
#           dsh-fnos-advanced-<version>.tgz.sha256
#
# The .sha256 file is the standard `sha256sum` output and is paired with the
# tarball by the same-name + ".sha256" rule used by the Harness updater.
#
# `--latest=false` is deliberate: this repository also publishes Harness
# releases, and the console's Harness update check may query the repository's
# "latest" release. A plugin release must never become that release.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: '发布说明（可选；留空则使用默认标题）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dsh-fnos-advanced-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dsh-fnos-advanced/package-lock.json

      - name: Read version from package.json
        id: meta
        working-directory: dsh-fnos-advanced
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$VERSION" ]; then
            echo "empty package.json version" >&2
            exit 1
          fi
          TAG="dsh-fnos-advanced-v${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_ENV"

      - name: Install and test
        working-directory: dsh-fnos-advanced
        run: |
          npm ci
          npm test

      - name: Build tarball and sha256
        working-directory: dsh-fnos-advanced
        run: |
          TARBALL="dsh-fnos-advanced-${VERSION}.tgz"
          npm pack --silent >/dev/null
          if [ ! -f "$TARBALL" ]; then
            echo "npm pack did not produce $TARBALL" >&2
            ls -l
            exit 1
          fi
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          cat "$TARBALL.sha256"

      - name: Upload tarball + checksum as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsh-fnos-advanced-${{ env.VERSION }}
          path: |
            dsh-fnos-advanced/dsh-fnos-advanced-*.tgz
            dsh-fnos-advanced/dsh-fnos-advanced-*.tgz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Reuse the release PAT already used by harness-build.yaml.
      # If your repository's secret has another name, change it here.
      GH_TOKEN: ${{ secrets.DSH }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      NOTES_INPUT: ${{ inputs.notes }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        run: |
          NOTES="$NOTES_INPUT"
          if [ -z "$NOTES" ]; then
            NOTES="dsh-fnos-advanced $VERSION"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "dsh-fnos-advanced $VERSION" \
              --notes "$NOTES" \
              --latest=false
          fi

          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published:"
          echo "  https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/dsh-fnos-advanced-$VERSION.tgz"
          echo "  https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/dsh-fnos-advanced-$VERSION.tgz.sha256"
