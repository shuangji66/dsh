name: Build Harness Binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.1.0）'
        required: true
        type: string
      notes:
        description: '发布说明（可选，留空则使用默认）'
        required: false
        type: string

jobs:
  # ========== 编译并打包 harness 二进制（amd64 / arm64） ==========
  build-harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      VERSION: ${{ github.event.inputs.version }}   # 全局版本号，供所有 steps 使用
    steps:
      - name: 检出 shuangji66/dsh 仓库
        uses: actions/checkout@v7
        with:
          repository: shuangji66/dsh
          path: dsh-src

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安装 Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: 构建前端
        working-directory: ./dsh-src/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 准备 embed 目录
        run: |
          mkdir -p ./dsh-src/backend/embed
          cp -r ./dsh-src/frontend/dist/* ./dsh-src/backend/embed/

      - name: 构建 Go 二进制（${{ matrix.arch }}）
        working-directory: ./dsh-src/backend
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X main.harnessVersion=$VERSION" -o harness .

      - name: 压缩二进制为 tar.gz 并生成 sha256 校验文件
        working-directory: ./dsh-src/backend
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            PLATFORM="x86"
          else
            PLATFORM="arm"
          fi
          ARCHIVE="harness-${VERSION}-${PLATFORM}.tar.gz"
          tar czf "$ARCHIVE" harness
          # 校验文件与包同名 + .sha256 后缀（控制台自更新时按同一规则取回，
          # 见 backend/update.go 的 checksumURL）。内容为 sha256sum 的标准输出：
          # `<64 位十六进制>  <文件名>`。
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"
          echo "PLATFORM=${PLATFORM}" >> $GITHUB_ENV   # 供后续上传使用

      - name: 上传压缩包与校验文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: harness-${{ env.PLATFORM }}
          path: |
            ./dsh-src/backend/harness-*.tar.gz
            ./dsh-src/backend/harness-*.tar.gz.sha256
          if-no-files-found: error

  # ========== 创建 Release 并上传 tar.gz 压缩包 ==========
  publish:
    needs: build-harness
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}   # 版本号用于 tag 和文件名
    steps:
      - name: 下载所有架构的压缩包
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布到 Release（使用 secrets.DSH）
        env:
          GH_TOKEN: ${{ secrets.DSH }}
        run: |
          REPO="${{ github.repository }}"
          TAG="harness-$VERSION"
          TITLE="Harness Binary $VERSION"

          # 获取用户输入的发布说明，若为空则使用默认
          USER_NOTES="${{ github.event.inputs.notes }}"
          if [ -z "$USER_NOTES" ]; then
            NOTES="手动构建 Harness 二进制版本 $VERSION"
          else
            NOTES="$USER_NOTES"
          fi

          # 如果 Release 已存在，则只追加资产；否则新建
          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            echo "Release $TAG 已存在，将添加资产"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NOTES"
          fi

          # 直接上传所有 tar.gz 与其 .sha256 校验文件（已按版本和平台命名）
          for file in artifacts/harness-*; do
            echo "上传 $file"
            gh release upload "$TAG" "$file" --repo "$REPO" --clobber
          done
