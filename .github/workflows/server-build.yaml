name: Auto Build dsh Server

on:
  schedule:
    # 每 8 小时运行一次：（北京时间 2:00 10:00 18:00）
    - cron: '0 2,10,18 * * *'
  workflow_dispatch:   # 支持手动触发调试
    inputs:
      notes:
        description: '发布说明（可选，留空则使用默认）'
        required: false
        type: string

jobs:
  # ========== 第一步：获取所有版本中的最高版本号 ==========
  fetch-version:
    runs-on: ubuntu-24.04
    outputs:
      dsh_version: ${{ steps.get_highest.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 获取所有版本并按 SemVer 排序取最高
        id: get_highest
        run: |
          # 获取所有版本的 JSON 数组，转为逐行，按版本排序，取最后一行（最高）
          HIGHEST=$(npm view @deepseek-ai/dsh versions --json | jq -r '.[]' | sort -V | tail -n 1)
          echo "version=$HIGHEST" >> $GITHUB_OUTPUT
          echo "检测到最高版本: $HIGHEST"

      - name: 检查该版本是否已有 Release（避免重复构建）
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_highest.outputs.version }}"
          if gh release view "dsh-$VERSION" --repo "${{ github.repository }}" &>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "版本 $VERSION 已构建并发布，跳过本次构建"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "版本 $VERSION 尚未构建，继续"
          fi

  # ========== 第二步：在 Debian 容器中构建 server.tar.gz（原第二步） ==========
  build-server:
    needs: fetch-version
    if: needs.fetch-version.outputs.skip != 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    container: debian:12
    outputs:
      version: ${{ needs.fetch-version.outputs.dsh_version }}   # 透传版本号
    steps:
      - name: 安装系统依赖 + Node.js 24
        run: |
          apt-get update
          apt-get install -y curl tar jq xz-utils build-essential
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          node -v
          npm -v

      - name: 打包 @deepseek-ai/dsh（使用检测到的最高版本）
        id: pack
        run: |
          VERSION="${{ needs.fetch-version.outputs.dsh_version }}"
          PACKED=$(npm pack "@deepseek-ai/dsh@$VERSION")
          echo "PACKED=$PACKED" >> $GITHUB_ENV
          tar xzf "$PACKED"

      - name: 添加 dshmarket 依赖到 package.json
        run: |
          cd package
          jq '.dependencies = (.dependencies // {} | . + {"dshmarket": "latest"})' package.json > tmp.json
          mv tmp.json package.json

      - name: 重新打包
        run: tar czf "$PACKED" package

      - name: 安装修改后的包到 /var/apps/Harness/target/server
        run: |
          mkdir -p /var/apps/Harness/target/server
          cd /var/apps/Harness/target/server
          npm init -y
          npm install "$GITHUB_WORKSPACE/$PACKED" --prefix /var/apps/Harness/target/server

      # ---------- 关键修改：给 dsh-app-boot 的 web.bundles 加入 dshmarket ----------
      - name: 修改 PROFILE_TEMPLATES.web.bundles
        run: |
          FILE="/var/apps/Harness/target/server/node_modules/@deepseek-ai/dsh-app-boot/lib/index.js"
          if [ ! -f "$FILE" ]; then
            echo "警告：$FILE 不存在，跳过修改"
            exit 0
          fi

          node -e "
            const fs = require('fs');
            const file = process.argv[1];
            let content = fs.readFileSync(file, 'utf8');

            const varName = 'PROFILE_TEMPLATES';
            const assignIndex = content.indexOf(varName + ' = {');
            if (assignIndex === -1) {
              console.error('未找到 PROFILE_TEMPLATES 定义');
              process.exit(1);
            }

            let braceCount = 0;
            let start = assignIndex + content.substring(assignIndex).indexOf('{');
            let end = start;
            for (let i = start; i < content.length; i++) {
              if (content[i] === '{') braceCount++;
              else if (content[i] === '}') {
                braceCount--;
                if (braceCount === 0) { end = i; break; }
              }
            }
            if (braceCount !== 0) { console.error('大括号不匹配'); process.exit(1); }
            const fullMatch = content.substring(start, end + 1);

            const webStart = fullMatch.indexOf('web:');
            if (webStart === -1) { console.error('未找到 web 属性'); process.exit(1); }
            let webObjStart = fullMatch.indexOf('{', webStart);
            let webBraceCount = 0;
            let webObjEnd = webObjStart;
            for (let i = webObjStart; i < fullMatch.length; i++) {
              if (fullMatch[i] === '{') webBraceCount++;
              else if (fullMatch[i] === '}') {
                webBraceCount--;
                if (webBraceCount === 0) { webObjEnd = i; break; }
              }
            }
            const webObjStr = fullMatch.substring(webObjStart, webObjEnd + 1);
            const bundlesRegex = /bundles\\s*:\\s*\\[([^\\]]*)\\]/;
            const bundlesMatch = webObjStr.match(bundlesRegex);
            if (!bundlesMatch) { console.error('未找到 bundles 数组'); process.exit(1); }

            let items = bundlesMatch[1].split(',').map(s => s.trim()).filter(s => s.length > 0);
            if (!items.includes('\"dshmarket\"')) {
              items.push('\"dshmarket\"');
              const newArrayStr = '[' + items.join(', ') + ']';
              const newWebObjStr = webObjStr.replace(bundlesRegex, 'bundles: ' + newArrayStr);
              const newFullMatch = fullMatch.substring(0, webObjStart) + newWebObjStr + fullMatch.substring(webObjEnd + 1);
              content = content.substring(0, start) + newFullMatch + content.substring(end + 1);
              fs.writeFileSync(file, content);
              console.log('已成功将 dshmarket 添加到 PROFILE_TEMPLATES.web.bundles');
            } else {
              console.log('dshmarket 已存在，无需修改');
            }
          " "$FILE"

      # ---------- 修补 dsh 附件存储的「祖先目录 fsync」（fnOS 上传失败） ----------
      # 背景：@deepseek-ai/dsh-attachment-local 落盘附件时做崩溃可耐久发布，会对每一级
      # 祖先目录 open(O_RDONLY) + fsync，并一路上溯到文件系统根 "/"。fnOS 把 /vol1 与
      # /vol1/@appshare 设为 mode 000（仅由 trim_acl 授予穿越 x，不给读 r），应用以
      # 自身 uid（无 CAP_DAC_OVERRIDE）无法读取这些祖先目录，首次上传即抛
      # `EACCES: permission denied, open '/vol1/@appshare'`，WEB 端上传文件与图片整体
      # 失败（会话/设置等其他落盘路径不上溯到根，故不受影响）。
      # 修法：上溯时遇到打不开的祖先即停止（不可读的祖先本就无法 fsync），授权目录内
      # 已创建的条目仍保持原有同步语义。仅改这一处，不动权限、不改存储位置。
      - name: 修补 dsh 附件存储的祖先 fsync（fnOS /vol1 不可读）
        run: |
          cat > /tmp/patch-attachment-fsync.cjs <<'PATCH_EOF'
          const fs = require('fs');
          const path = process.argv[2];
          const MARKER = 'dsh:fnos-ancestor-fsync';
          const ANCHOR_RE = /([ \t]+let level = target;\r?\n[ \t]+while \(level !== stop\) \{\r?\n[ \t]+const parent = dirname\(level\);\r?\n)([ \t]+)(await syncDirectory\(parent\);)(\r?\n)/;

          if (!fs.existsSync(path)) {
            console.log(`::warning::未找到 ${path}，跳过附件 fsync 修补（请确认 dsh 包布局是否变化）`);
            process.exit(0);
          }
          const src = fs.readFileSync(path, 'utf8');
          if (src.includes(MARKER)) {
            console.log('附件 fsync 补丁已存在，无需重复注入');
            process.exit(0);
          }
          const m = src.match(ANCHOR_RE);
          if (m) {
            const ind = m[2];
            const nl = m[4];
            const replacement = m[1] +
              ind + 'try {' + nl +
              ind + '\t' + m[3] + nl +
              ind + '} catch (error) {' + nl +
              ind + '\t/* ' + MARKER + ' —— fnOS 把 /vol1 与 /vol1/@appshare 设为 mode 000，' + nl +
              ind + '\t   仅由 trim_acl 授予穿越；非 root 无法 open(O_RDONLY) 祖先目录，' + nl +
              ind + '\t   耐久性 fsync 因此抛 EACCES，使 WEB 端上传文件/图片整体失败。' + nl +
              ind + '\t   不可读的祖先本就无法同步，故停止上溯；授权目录内已创建的' + nl +
              ind + '\t   条目仍已同步。 */' + nl +
              ind + '\tif (error && (error.code === "EACCES" || error.code === "EPERM")) return;' + nl +
              ind + '\tthrow error;' + nl +
              ind + '}' + nl;
            fs.writeFileSync(path, src.replace(ANCHOR_RE, replacement));
            if (!fs.readFileSync(path, 'utf8').includes(MARKER)) {
              console.error(`补丁写入后校验失败: ${path}`);
              process.exit(1);
            }
            console.log('已注入附件存储的祖先 fsync 修补（无法读取的祖先即停止上溯）');
            process.exit(0);
          }
          if (src.includes('parse(home).root')) {
            console.error(`锚点缺失，但仍存在「上溯到文件系统根」的耐久化逻辑: ${path}`);
            console.error('请人工核对上游改动，更新本步骤的 ANCHOR_RE 与替换体后再发布。');
            process.exit(1);
          }
          console.log('::warning::上游似已移除「上溯到 /」的耐久化逻辑，跳过本补丁（请人工确认上传可用）');
          PATCH_EOF
          node /tmp/patch-attachment-fsync.cjs \
            "/var/apps/Harness/target/server/node_modules/@deepseek-ai/dsh-attachment-local/lib/index.js"

      - name: 压缩 server 目录，以版本号+平台命名
        run: |
          VERSION="${{ needs.fetch-version.outputs.dsh_version }}"
          PLATFORM="${{ matrix.platform }}"
          ARCHIVE_NAME="server-${PLATFORM}-${VERSION}.tar.gz"
          tar czf "$GITHUB_WORKSPACE/$ARCHIVE_NAME" -C /var/apps/Harness/target server
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: 上传 server.tar.gz 作为 Artifact（供发布用）
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.platform }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  # ========== 第三步：发布到当前仓库的 Release ==========
  publish:
    needs: [fetch-version, build-server]
    if: needs.fetch-version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载所有平台的 server.tar.gz
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # ---------- 获取上游 Release Notes 并写入文件 ----------
      - name: 获取上游 Release Notes
        id: fetch_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.fetch-version.outputs.dsh_version }}"
          UPSTREAM_REPO="deepseek-ai/deepseek-harness"
          TAG="dsh-v${VERSION}"

          if NOTES=$(gh release view "$TAG" --repo "$UPSTREAM_REPO" --json body -q .body 2>/dev/null); then
            echo "$NOTES" > /tmp/upstream_notes.txt
            echo "✅ 成功从上游获取 Release Notes"
          else
            echo "自动构建 dsh $VERSION 的 server 包（包含 dshmarket 依赖）" > /tmp/upstream_notes.txt
            echo "⚠️ 无法从上游获取 Release Notes，使用默认说明"
          fi

      - name: 创建/更新 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.DSH }}
          USER_NOTES: ${{ github.event.inputs.notes }}   # 通过环境变量传递多行输入
        run: |
          VERSION="${{ needs.fetch-version.outputs.dsh_version }}"
          REPO="${{ github.repository }}"
          TAG="dsh-$VERSION"
          TITLE="dsh Server $VERSION"

          # 优先用户手动输入，否则使用上游 notes
          if [ -n "$USER_NOTES" ]; then
            printf '%s\n' "$USER_NOTES" > /tmp/release_notes.txt
          else
            cp /tmp/upstream_notes.txt /tmp/release_notes.txt
          fi

          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            echo "Release $TAG 已存在，将添加新资产"
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file /tmp/release_notes.txt
          fi

          for file in artifacts/*.tar.gz; do
            echo "上传 $file"
            gh release upload "$TAG" "$file" --repo "$REPO" --clobber
          done
