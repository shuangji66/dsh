<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让 env(safe-area-inset-*) 在 iPhone 上返回真实安全区，
         底部导航据此避开 Home Indicator（见 App.vue 与 style.css 的 --bottom-nav-h）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DeepSeek Harness 控制台</title>
    <meta name="theme-color" content="#FAFAFA" />
    <!-- 字体：全站统一走系统字体（system-ui / ui-monospace，见 src/style.css 的 @theme）。
         这里刻意不引入任何外链 Web 字体：原先的 DM Sans / General Sans / JetBrains Mono 来自
         两个 CDN，来源与可用性各不相同，缺哪一套就按字符回退，同一页里会同时出现好几套字形；
         而且外链字体是首屏的额外网络依赖（设备在代理后面或离线时会卡在字体请求上）。 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
