<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>授权回调中...</title>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "@trimjs/web-app": "https://cdn.jsdelivr.net/npm/@trimjs/web-app/dist/index.js"
    }
  }
  </script>
  <script type="module">
    import { TrimApp } from '@trimjs/web-app'
    
    const sdk = new TrimApp()
    // 解析当前 URL 中的授权结果[reference:8]
    const result = sdk.parseAppAuthCallback(window.location.href)
    
    // 校验 state，确认结果来自本次授权请求[reference:9]
    const savedState = sessionStorage.getItem('fnos_auth_state')
    if (result.state && result.state !== savedState) {
      console.error('State 验证失败')
    }
    
    // 通知原应用页面[reference:10]
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        type: 'harness:auth-result',
        result,
      }, window.location.origin)
    }
    
    // 关闭当前窗口[reference:11]
    window.close()
  </script>
  <p>授权完成，正在返回...</p>
</body>
</html>
