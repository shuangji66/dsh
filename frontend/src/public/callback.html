<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授权回调中...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #0a0a0a;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* 居中卡片：白色表面、细边框、圆角 */
    .card {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border: 1px solid #e8e8ec;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      padding: 48px 32px 40px;
      text-align: center;
      animation: cardIn 0.35s ease-out both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 状态图标（成功勾选） */
    .icon-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 9999px;
      background: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
    }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .icon-wrap svg {
      width: 32px;
      height: 32px;
      stroke: #ffffff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* 主文案 */
    h1 {
      font-family: "General Sans", "DM Sans", ui-sans-serif, system-ui, sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0a0a0a;
      margin-bottom: 8px;
    }

    /* 次要文案 */
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #6b6b6b;
    }

    /* 加载中的小圆点动画（极短暂，关闭前一闪而过） */
    .dots {
      display: inline-flex;
      gap: 5px;
      margin-top: 18px;
      opacity: 0.8;
    }
    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: #6366f1;
      animation: blink 1s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    </div>
    <h1 id="title">授权完成</h1>
    <p id="msg">正在返回，请稍候...</p>
    <div class="dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "@trimjs/web-app": "https://cdn.jsdelivr.net/npm/@trimjs/web-app/dist/index.js"
    }
  }
  </script>
  <script type="module">
    import { TrimApp } from '@trimjs/web-app'

    const sdk = new TrimApp()
    // 解析当前 URL 中的授权结果
    const result = sdk.parseAppAuthCallback(window.location.href)

    // 根据结果更新文案与图标状态
    const title = document.getElementById('title')
    const msg = document.getElementById('msg')
    const icon = document.querySelector('.icon-wrap svg')
    if (result) {
      if (result.status === 'cancel' || result.error === 'access_denied') {
        title.textContent = '已取消授权'
        msg.textContent = '已返回原页面'
        icon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
      } else if (result.status === 'error') {
        title.textContent = '授权失败'
        msg.textContent = '出现异常，请返回重试'
        icon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
      }
    }

    // 校验 state，确认结果来自本次授权请求
    const savedState = sessionStorage.getItem('fnos_auth_state')
    if (result.state && result.state !== savedState) {
      console.error('State 验证失败')
    }

    // 通知原应用页面
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        type: 'harness:auth-result',
        result,
      }, window.location.origin)
    }

    // 短暂展示反馈后自动关闭当前窗口
    setTimeout(() => window.close(), 600)
  </script>
</body>
</html>
